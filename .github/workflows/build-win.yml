name: 自动打包 Windows exe
on:
  # 每次推送到 main 分支自动打包
  push:
    branches: [ main ]
  # 允许手动点击触发打包
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest  # 用 GitHub 的 Windows 服务器打包
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'  # 缓存依赖，加快打包速度

      - name: 安装项目依赖
        run: npm ci  # 比 npm install 更稳定，用 package-lock.json

      - name: 打包 Windows 版本
        run: npm run build:win

      - name: 上传打包好的 exe 文件
        uses: actions/upload-artifact@v4
        with:
          name: MultiBrowser-Windows
          path: |
            dist/*.exe
            dist/*.zip
          retention-days: 30  # 文件保留30天